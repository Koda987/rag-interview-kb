<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识引擎 — RAG 智能客服</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b4fcf'/%3E%3Ctext x='50' y='70' font-size='55' text-anchor='middle' fill='white'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
    <style>
        /* ============================================================
           DESIGN SYSTEM — 知识引擎 Knowledge Engine
           ============================================================ */
        :root {
            --ink: #1c1b1f;
            --ink-muted: #5f5d66;
            --ink-subtle: #94929e;
            --paper: #faf8f5;
            --paper-warm: #f4f0ea;
            --surface: #ffffff;
            --border: #e8e6e1;

            --brand: #5b4fcf;
            --brand-dark: #4439b3;
            --brand-light: #7e73e0;
            --brand-ghost: #f3f1fe;

            /* 标题用系统字族：Web 字体在国内加载失败回退宋体，观感差 */
            --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                            'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

            --text-xs: 0.6875rem;
            --text-sm: 0.8125rem;
            --text-base: 0.9375rem;
            --text-md: 1.0625rem;
            --text-lg: 1.25rem;
            --text-xl: 1.5rem;
            --text-2xl: 2rem;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            --shadow-sm: 0 1px 2px rgba(28,27,31,0.04);
            --shadow-md: 0 4px 16px rgba(28,27,31,0.06);
            --shadow-lg: 0 12px 40px rgba(28,27,31,0.08);
            --shadow-glow: 0 0 0 3px rgba(91,79,207,0.12);

            --ease-out: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }

        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* Subtle background pattern — paper grain */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(91,79,207,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(91,79,207,0.02) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        /* ============================================================
           HERO SECTION
           ============================================================ */
        .hero {
            position: relative; z-index: 1;
            max-width: 640px; width: 100%;
            text-align: center;
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            border-radius: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff; font-size: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(91,79,207,0.2);
        }
        .hero h1 {
            font-family: var(--font-display);
            font-size: var(--text-2xl); font-weight: 700;
            letter-spacing: -0.02em; margin-bottom: 8px;
            color: var(--ink);
        }
        .hero .subtitle {
            font-size: var(--text-base); color: var(--ink-muted);
            margin-bottom: 20px; line-height: 1.6;
        }

        /* ============================================================
           FEATURE CHIPS
           ============================================================ */
        .feature-chips {
            display: flex; gap: 8px; justify-content: center;
            flex-wrap: wrap; margin-bottom: 40px;
        }
        .feature-chips .chip {
            padding: 4px 12px; font-size: var(--text-xs); font-weight: 500;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-full); color: var(--ink-muted);
        }

        /* ============================================================
           ENTRY CARDS
           ============================================================ */
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 500px) {
            .cards { grid-template-columns: 1fr; }
        }

        .entry-card {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 32px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            text-decoration: none; color: var(--ink);
            transition: var(--ease-out);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative; overflow: hidden;
        }
        .entry-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--brand-light);
        }
        .entry-card::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--brand), var(--brand-light));
            transform: scaleX(0); transition: transform 0.3s ease-out;
        }
        .entry-card:hover::after { transform: scaleX(1); }

        .entry-card .card-emoji {
            font-size: 36px; margin-bottom: 14px;
        }
        .entry-card h2 {
            font-family: var(--font-display);
            font-size: var(--text-lg); font-weight: 700;
            margin-bottom: 6px;
        }
        .entry-card p {
            font-size: var(--text-sm); color: var(--ink-muted);
            line-height: 1.5;
        }
        .entry-card .card-arrow {
            margin-top: 14px; font-size: var(--text-xs);
            color: var(--brand); font-weight: 600;
            opacity: 0.6; transform: translateX(0);
            transition: var(--ease-out);
        }
        .entry-card:hover .card-arrow {
            opacity: 1; transform: translateX(3px);
        }

        /* 图标（Lucide 线条图标） */
        .ic {
            width: 1em; height: 1em;
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
            vertical-align: -0.125em;
        }
        .card-emoji .ic { width: 36px; height: 36px; color: var(--brand); }
        .card-emoji { margin-bottom: 14px; }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            margin-top: 32px;
            font-size: var(--text-xs); color: var(--ink-subtle);
        }
        .footer span { margin: 0 8px; }
    </style>
</head>
<body>

<!-- 图标精灵：Lucide v0.462.0（ISC License）https://lucide.dev -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-message-circle" viewBox="0 0 24 24">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
    </symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24">
        <path d="M12 7v14" />
        <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
    </symbol>
</svg>

<div class="hero">
    <div class="hero-logo">◈</div>
    <h1>知识引擎</h1>
    <p class="subtitle">
        基于 RAG 检索增强生成的智能客服系统<br>
        将文档转化为精准、可溯源的对话体验
    </p>

    <div class="feature-chips">
        <span class="chip">🔍 语义检索</span>
        <span class="chip">💬 多轮对话</span>
        <span class="chip">⚡ 流式输出</span>
        <span class="chip">🗂 知识库管理</span>
        <span class="chip">🛡 内容去重</span>
    </div>

    <div class="cards">
        <a href="/api/chat" class="entry-card">
            <span class="card-emoji"><svg class="ic"><use href="#i-message-circle"/></svg></span>
            <h2>智能对话</h2>
            <p>与知识库进行自然语言问答，AI 基于文档内容给出有据可查的回答</p>
            <span class="card-arrow">进入对话 →</span>
        </a>

        <a href="/api/upload" class="entry-card">
            <span class="card-emoji"><svg class="ic"><use href="#i-book-open"/></svg></span>
            <h2>知识库管理</h2>
            <p>上传文档、添加知识条目，构建专属知识库，让 AI 更懂你的业务</p>
            <span class="card-arrow">管理知识库 →</span>
        </a>
    </div>

    <div class="footer">
        RAG Knowledge Engine <span>·</span> LangChain + Chroma <span>·</span> FastAPI
        <span>·</span>
        <a href="https://github.com/Koda987/rag-knowledge" target="_blank"
           style="color: inherit; text-decoration: underline dotted;">GitHub</a>
    </div>
</div>

</body>
</html>
