    <style>
        /* ============================================================
           DESIGN SYSTEM — 知识引擎 Knowledge Engine
           Inspired by library archives & paper texture.
           ============================================================ */
        :root {
            /* Palette */
            --ink: #1c1b1f;
            --ink-muted: #5f5d66;
            --ink-subtle: #94929e;
            --paper: #faf8f5;
            --paper-warm: #f4f0ea;
            --surface: #ffffff;
            --border: #e8e6e1;
            --border-light: #f0ede8;

            /* Brand — muted plum */
            --brand: #5b4fcf;
            --brand-dark: #4439b3;
            --brand-light: #7e73e0;
            --brand-ghost: #f3f1fe;
            --brand-surface: #faf9ff;

            /* Semantic */
            --success: #2d6a4f;
            --success-bg: #edf7f1;
            --warning: #8a6d14;
            --warning-bg: #fef9e7;
            --error: #c1292e;
            --error-bg: #fef2f2;

            /* Typography */
            /* 标题沿用系统字族：原先依赖 Google Fonts 的衬线体，
               国内加载失败会回退宋体，观感全毁 */
            --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                            'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                         'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;

            /* Type scale */
            --text-xs: 0.6875rem;    /* 11px */
            --text-sm: 0.8125rem;    /* 13px */
            --text-base: 0.9375rem;  /* 15px */
            --text-md: 1.0625rem;    /* 17px */
            --text-lg: 1.25rem;      /* 20px */
            --text-xl: 1.5rem;       /* 24px */

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;

            /* Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-full: 9999px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(28,27,31,0.04);
            --shadow-md: 0 4px 16px rgba(28,27,31,0.06);
            --shadow-lg: 0 12px 40px rgba(28,27,31,0.08);
            --shadow-glow: 0 0 0 3px rgba(91,79,207,0.12);

            /* Transitions */
            --ease-out: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 16px; -webkit-font-smoothing: antialiased; }

        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        .nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border);
            padding: 0 var(--space-xl);
        }
        .nav-inner {
            max-width: 1100px; margin: 0 auto;
            display: flex; align-items: center; gap: var(--space-lg);
            height: 56px;
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--ink);
            font-family: var(--font-display);
            font-weight: 700; font-size: var(--text-md);
            letter-spacing: -0.01em;
        }
        .nav-brand .logo-mark {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .nav-links {
            display: flex; gap: 4px; margin-left: var(--space-xl);
        }
        .nav-link {
            padding: 6px 14px; border-radius: var(--radius-sm);
            text-decoration: none; font-size: var(--text-sm); font-weight: 500;
            color: var(--ink-muted); transition: var(--ease-out);
        }
        .nav-link:hover { color: var(--ink); background: var(--paper-warm); }
        .nav-link.active {
            color: var(--brand); background: var(--brand-ghost); font-weight: 600;
        }
        .nav-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm); }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        .main {
            max-width: 800px; margin: 0 auto;
            display: flex; flex-direction: column;
            height: calc(100vh - 56px);
            padding: 0 var(--space-md);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: var(--space-2xl);
            gap: var(--space-lg);
        }
        .empty-state .hero-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--brand-ghost), #ede9fe);
            border-radius: var(--radius-xl);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .empty-state h2 {
            font-family: var(--font-display);
            font-size: var(--text-xl); font-weight: 700;
            color: var(--ink); letter-spacing: -0.02em;
        }
        .empty-state p {
            color: var(--ink-muted); font-size: var(--text-sm);
            max-width: 380px; line-height: 1.7;
        }
        .empty-state .hint-grid {
            display: flex; gap: var(--space-md); flex-wrap: wrap;
            justify-content: center; margin-top: var(--space-sm);
        }
        .hint-chip {
            padding: 7px 16px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-full); font-size: var(--text-xs);
            color: var(--ink-muted); cursor: pointer;
            transition: var(--ease-out); white-space: nowrap;
        }
        .hint-chip:hover {
            border-color: var(--brand-light); color: var(--brand);
            box-shadow: var(--shadow-glow);
        }

        /* ============================================================
           MESSAGE LIST
           ============================================================ */
        .messages {
            flex: 1; overflow-y: auto; padding: var(--space-lg) 0;
            display: flex; flex-direction: column; gap: var(--space-lg);
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb {
            background: var(--border); border-radius: 10px;
        }
        .messages::-webkit-scrollbar-thumb:hover { background: var(--ink-subtle); }

        /* Message bubble */
        .msg {
            display: flex; gap: 12px;
            animation: msgIn 0.3s ease-out;
            max-width: 88%;
        }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.assistant { align-self: flex-start; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar {
            width: 34px; height: 34px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .msg.user .msg-avatar { background: var(--brand-ghost); }
        .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--brand), var(--brand-light)); }

        .msg-body { min-width: 0; }

        .msg-bubble {
            padding: 12px 18px; line-height: 1.65;
            font-size: var(--text-base); word-break: break-word;
        }
        .msg.user .msg-bubble {
            background: var(--brand);
            color: #fff;
            border-radius: var(--radius-lg) var(--radius-lg) 6px var(--radius-lg);
        }
        .msg.assistant .msg-bubble {
            background: var(--surface);
            color: var(--ink);
            border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 6px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }
        .msg.assistant .msg-bubble p { margin-bottom: 0.6em; }
        .msg.assistant .msg-bubble p:last-child { margin-bottom: 0; }
        .msg.assistant .msg-bubble code {
            background: var(--paper-warm); padding: 2px 6px;
            border-radius: 4px; font-family: var(--font-mono);
            font-size: 0.9em; color: var(--brand-dark);
        }
        .msg.assistant .msg-bubble pre {
            background: var(--paper-warm); padding: 12px 16px;
            border-radius: var(--radius-sm); overflow-x: auto;
            font-family: var(--font-mono); font-size: var(--text-xs);
            margin: 8px 0; line-height: 1.5;
            border: 1px solid var(--border);
        }
        .msg-time {
            font-size: var(--text-xs); color: var(--ink-subtle);
            margin-top: 4px; padding: 0 4px;
        }
        .msg.user .msg-time { text-align: right; }

        /* Typing indicator */
        .typing-dots {
            display: flex; gap: 4px; padding: 4px 0;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            background: var(--ink-subtle); border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area {
            padding: var(--space-md) 0 var(--space-lg);
            flex-shrink: 0;
        }
        .input-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex; align-items: flex-end; gap: var(--space-sm);
            padding: 8px 12px;
            transition: var(--ease-out);
        }
        .input-card:focus-within {
            border-color: var(--brand-light);
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }
        .input-card textarea {
            flex: 1; border: none; background: transparent;
            padding: 8px 4px; font-size: var(--text-base);
            font-family: var(--font-body); line-height: 1.5;
            resize: none; outline: none; max-height: 120px;
            color: var(--ink);
        }
        .input-card textarea::placeholder { color: var(--ink-subtle); }
        .btn-send {
            height: 40px; padding: 0 18px; flex-shrink: 0;
            border: none; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #fff; cursor: pointer; font-size: var(--text-sm); font-weight: 600;
            font-family: var(--font-body); letter-spacing: 0.02em;
            transition: var(--ease-spring);
            display: flex; align-items: center; justify-content: center;
        }
        .btn-send:hover { transform: scale(1.06); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .input-hint { font-size: var(--text-xs); color: var(--ink-subtle); text-align: center; margin-top: 6px; }

        /* ============================================================
           BUTTONS (shared)
           ============================================================ */
        .btn-sm {
            padding: 6px 14px; font-size: var(--text-xs); font-weight: 600;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); color: var(--ink-muted);
            cursor: pointer; transition: var(--ease-out);
            font-family: var(--font-body);
        }
        .btn-sm:hover { border-color: var(--brand-light); color: var(--brand); }

        /* 危险操作按钮（清空对话）：默认克制，悬停时警示 */
        .btn-danger {
            padding: 6px 14px; font-size: var(--text-xs); font-weight: 600;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); color: var(--ink-muted);
            cursor: pointer; transition: var(--ease-out);
            font-family: var(--font-body);
        }
        .btn-danger:hover {
            border-color: var(--error); color: var(--error); background: var(--error-bg);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed; top: 72px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: var(--surface); padding: 12px 18px;
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            font-size: var(--text-sm); border-left: 3px solid var(--brand);
            animation: slideIn 0.3s ease-out; max-width: 360px;
            line-height: 1.5;
        }
        .toast.error { border-left-color: var(--error); }
        .toast.success { border-left-color: var(--success); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================================
           SESSION DRAWER（会话列表抽屉）
           ============================================================ */
        .drawer-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(28,27,31,0.35);
            opacity: 0; visibility: hidden;
            transition: var(--ease-out);
        }
        .drawer {
            position: fixed; top: 0; left: 0; bottom: 0; z-index: 201;
            width: 300px; max-width: 85vw;
            background: var(--surface);
            border-right: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        body.drawer-open .drawer { transform: translateX(0); }
        body.drawer-open .drawer-overlay { opacity: 1; visibility: visible; }

        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }
        .drawer-header .dh-title {
            font-size: var(--text-base); font-weight: 700;
        }
        .drawer-header .dh-close {
            width: 28px; height: 28px; border: none; border-radius: var(--radius-sm);
            background: transparent; color: var(--ink-muted); cursor: pointer;
            font-size: 14px; transition: var(--ease-out);
        }
        .drawer-header .dh-close:hover { background: var(--paper-warm); color: var(--ink); }

        .drawer-current {
            padding: 10px 16px;
            font-size: var(--text-xs); color: var(--ink-muted);
            border-bottom: 1px solid var(--border-light);
            background: var(--paper);
        }
        .drawer-current code { font-family: var(--font-mono); color: var(--brand-dark); }

        .drawer-list { flex: 1; overflow-y: auto; padding: 8px; }
        .drawer-list::-webkit-scrollbar { width: 4px; }
        .drawer-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .session-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--ease-out);
        }
        .session-item:hover { background: var(--paper-warm); }
        .session-item.active { background: var(--brand-ghost); }
        .session-item .si-body { flex: 1; min-width: 0; }
        .session-item .si-title {
            font-size: var(--text-sm); font-weight: 600; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .session-item .si-meta {
            font-size: var(--text-xs); color: var(--ink-subtle); margin-top: 2px;
        }
        .session-item .si-del {
            width: 26px; height: 26px; flex-shrink: 0;
            border: none; background: transparent; border-radius: var(--radius-sm);
            color: var(--ink-subtle); cursor: pointer; font-size: 13px;
            opacity: 0; transition: var(--ease-out);
        }
        .session-item:hover .si-del { opacity: 1; }
        .session-item .si-del:hover { background: var(--error-bg); color: var(--error); }

        .drawer-empty {
            text-align: center; color: var(--ink-subtle);
            padding: var(--space-xl) var(--space-md); font-size: var(--text-sm);
            line-height: 1.8;
        }

        /* ============================================================
           图标（Lucide 线条图标：继承文字颜色）
           ============================================================ */
        .ic {
            width: 1em; height: 1em; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
            vertical-align: -0.125em;
        }
        .dh-title .ic { width: 15px; height: 15px; color: var(--brand); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            .nav { padding: 0 var(--space-md); }
            .nav-links { display: none; }
            .main { padding: 0 var(--space-sm); }
            .msg { max-width: 95%; }
            .msg-bubble { padding: 10px 14px; font-size: var(--text-sm); }
            .input-card { padding: 6px 10px; }
        }
    </style>
</head>

    const API_BASE = '/api';
    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const inputEl = document.getElementById('userInput');
    const sessionList = document.getElementById('sessionList');
    const currentSessionLabel = document.getElementById('currentSessionLabel');
    const toastContainer = document.getElementById('toastContainer');

    let messageCount = 0;
    let currentSessionId = 'default';

    // ==================== Auto-resize textarea ====================
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // ==================== Keyboard ====================
    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ==================== Quick ask (hint chips) ====================
    function quickAsk(text) {
        inputEl.value = text;
        sendMessage();
    }

    // ==================== Chat: Send Message ====================
    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        const btnSend = document.getElementById('btnSend');
        if (btnSend.disabled) return;  // 流式回答进行中，防重复发送

        // Hide empty state on first message
        if (messageCount === 0) {
            emptyState.style.display = 'none';
            messagesEl.style.display = 'flex';
        }

        addMessage('user', text);
        messageCount++;
        inputEl.value = '';
        inputEl.style.height = 'auto';

        // 流式期间禁用发送，避免并发两路回答
        btnSend.disabled = true;
        btnSend.textContent = '回答中…';

        const typingEl = addTypingIndicator();
        scrollToBottom();

        let bubbleEl = null;  // 流式气泡（首块文本到达后创建）

        try {
            // SSE 流式问答：边生成边渲染（fetch + ReadableStream 解析）
            const response = await fetch(`${API_BASE}/qa/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, session_id: currentSessionId })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || '请求失败');
            }
            if (!response.body) {
                throw new Error('当前浏览器不支持流式接收');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';   // 未完成的帧缓存
            let full = '';     // 已累计的回答文本
            let streamError = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // SSE 帧以空行（\n\n）分隔，一次读取可能包含多帧
                let idx;
                while ((idx = buffer.indexOf('\n\n')) !== -1) {
                    const frame = buffer.slice(0, idx);
                    buffer = buffer.slice(idx + 2);
                    const dataLine = frame.startsWith('data: ') ? frame.slice(6) : frame;

                    if (dataLine === '[DONE]') continue;

                    let payload = null;
                    try { payload = JSON.parse(dataLine); } catch (e) { /* 跳过坏帧 */ }
                    if (payload && payload.error) { streamError = payload.error; break; }
                    if (payload && payload.text) full += payload.text;

                    // 首块文本到达：打字指示器换成真实气泡，开始增量渲染
                    if (!bubbleEl && full) {
                        typingEl.remove();
                        bubbleEl = createStreamingBubble();
                        messageCount++;
                    }
                    if (bubbleEl) {
                        bubbleEl.innerHTML = escapeHtml(full).replace(/\n/g, '<br>');
                        scrollToBottom();
                    }
                }
                if (streamError) break;
            }

            typingEl.remove();
            if (streamError) throw new Error(streamError);
            if (bubbleEl) {
                // 流结束后对完整文本做一次 Markdown 渲染
                bubbleEl.innerHTML = renderContent(full || '（空回复）');
            } else {
                addMessage('assistant', full || '（空回复）');
                messageCount++;
            }
        } catch (err) {
            typingEl.remove();
            if (bubbleEl) {
                // 流中断：保留已生成部分，追加错误提示
                bubbleEl.innerHTML += '<br><br>⚠️ 连接中断：' + escapeHtml(err.message);
                showToast('回答流中断：' + err.message, 'error');
            } else {
                addMessage('assistant', '抱歉，服务暂时不可用：' + err.message);
                messageCount++;
            }
        }

        btnSend.disabled = false;
        btnSend.textContent = '发送';
        loadSessions();  // 首条消息决定会话标题，问答后静默刷新列表
        scrollToBottom();
    }

    // ==================== Chat: Messages ====================
    function addMessage(role, content) {
        const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = `msg ${role}`;

        const avatarEmoji = role === 'user' ? '👤' : AT_AVATAR;
        // Simple markdown-like rendering for code blocks and inline code
        const rendered = renderContent(content);

        div.innerHTML = `
            <div class="msg-avatar">${avatarEmoji}</div>
            <div class="msg-body">
                <div class="msg-bubble">${rendered}</div>
                <div class="msg-time">${time}</div>
            </div>
        `;
        messagesEl.appendChild(div);
    }

    function addTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.id = 'typing-indicator';
        div.innerHTML = `
            <div class="msg-avatar">${AT_AVATAR}</div>
            <div class="msg-body">
                <div class="msg-bubble">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            </div>
        `;
        messagesEl.appendChild(div);
        return div;
    }

    // ==================== Streaming bubble ====================
    function createStreamingBubble() {
        const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = `
            <div class="msg-avatar">${AT_AVATAR}</div>
            <div class="msg-body">
                <div class="msg-bubble"></div>
                <div class="msg-time">${time}</div>
            </div>
        `;
        messagesEl.appendChild(div);
        return div.querySelector('.msg-bubble');
    }

    // ==================== Simple markdown renderer ====================
    function renderContent(text) {
        // Escape HTML first
        const escaped = escapeHtml(text);
        // Code blocks: ``` ... ```
        let html = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
            return `<pre><code>${code.trim()}</code></pre>`;
        });
        // Inline code: `...`
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Bold: **...**
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        // Newlines to <br> (but not inside pre tags)
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== Clear Chat ====================
    async function clearChat() {
        if (messageCount === 0) return;
        if (!confirm('确定删除当前会话的全部对话记录吗？')) return;

        try {
            await fetch(`${API_BASE}/qa/history`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId })
            });
            resetConversationView();
            loadSessions();  // 会话文件已删除，列表同步移除
            showToast('对话历史已删除', 'success');
        } catch (err) {
            showToast('删除失败: ' + err.message, 'error');
        }
    }

    // ==================== Conversation view reset ====================
    function resetConversationView() {
        messagesEl.innerHTML = '';
        messagesEl.style.display = 'none';
        emptyState.style.display = 'flex';
        messageCount = 0;
    }

    // ==================== New session ====================
    function newSession() {
        const id = 's-' + Math.random().toString(36).slice(2, 8);
        setCurrentSession(id);
        resetConversationView();
        closeDrawer();
        showToast('已开启新会话', '');
    }

    // ==================== History restore ====================
    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/qa/history?session_id=${encodeURIComponent(currentSessionId)}`);
            if (!res.ok) return;
            const data = await res.json();
            if (!data.messages || data.messages.length === 0) return;

            emptyState.style.display = 'none';
            messagesEl.style.display = 'flex';
            for (const m of data.messages) {
                addMessage(m.role, m.content);
                messageCount++;
            }
            scrollToBottom();
        } catch (err) {
            // 历史恢复失败不阻塞新对话，静默降级
        }
    }

    // ==================== Helpers ====================
    function scrollToBottom() {
        requestAnimationFrame(() => {
            if (messagesEl.style.display !== 'none') {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        });
    }

    function showToast(msg, type) {
        type = type || '';
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3200);
    }

    // ==================== Session state ====================
    function setCurrentSession(id) {
        currentSessionId = id;
        try { localStorage.setItem('rag-last-session', id); } catch (e) { /* 隐私模式等场景忽略 */ }
        currentSessionLabel.textContent = id;
    }

    // ==================== Session drawer ====================
    function openDrawer() {
        document.body.classList.add('drawer-open');
        loadSessions();
    }

    function closeDrawer() {
        document.body.classList.remove('drawer-open');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
    });

    async function loadSessions() {
        try {
            const res = await fetch(`${API_BASE}/qa/sessions`);
            if (!res.ok) return;
            const data = await res.json();
            renderSessions(data.sessions || []);
        } catch (err) {
            // 列表加载失败不打断聊天
        }
    }

    function renderSessions(sessions) {
        if (sessions.length === 0) {
            sessionList.innerHTML =
                '<div class="drawer-empty">暂无历史会话<br>发送第一条消息后会自动出现在这里</div>';
            return;
        }
        sessionList.innerHTML = sessions.map(s => `
            <div class="session-item ${s.session_id === currentSessionId ? 'active' : ''}"
                 onclick="switchSession('${s.session_id}')" title="${escapeHtml(s.title)}">
                <div class="si-body">
                    <div class="si-title">${escapeHtml(s.title)}</div>
                    <div class="si-meta">${s.message_count} 条 · ${s.updated_at}</div>
                </div>
                <button class="si-del" title="删除该会话"
                        onclick="event.stopPropagation(); deleteSession('${s.session_id}')">✕</button>
            </div>
        `).join('');
    }

    async function switchSession(id) {
        if (id === currentSessionId) { closeDrawer(); return; }
        setCurrentSession(id);
        resetConversationView();
        closeDrawer();
        loadHistory();
    }

    async function deleteSession(id) {
        if (!confirm(`确定删除会话「${id}」吗？该操作不可恢复。`)) return;
        try {
            await fetch(`${API_BASE}/qa/history`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: id })
            });
            if (id === currentSessionId) {
                resetConversationView();
            }
            loadSessions();
            showToast('会话已删除', 'success');
        } catch (err) {
            showToast('删除失败: ' + err.message, 'error');
        }
    }

    // ==================== Init ====================
    // 恢复上次使用的会话（没有则 default），加载其历史
    let lastSession = 'default';
    try { lastSession = localStorage.getItem('rag-last-session') || 'default'; } catch (e) {}
    setCurrentSession(lastSession);
    loadHistory();
</script>
